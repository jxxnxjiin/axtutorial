# ax-tutor 위키 네비게이션 — build_wiki.py의 단일 구조 소스.
#
# 규칙
#   - group  : 하위 항목을 묶는 섹션/하위섹션. children 필수. (사이드바에서 접힌 트리로 표시)
#   - label + path : 실제 페이지 링크. path 는 docs 루트(ax-wiki/docs) 기준 .md 경로.
#       · 해당 md 가 있으면  → build 대상(이전/다음 페이저에 포함)
#       · 해당 md 가 없으면  → 정적 페이지 링크로만 취급(직접 만든 HTML)
#   - icon   : (선택) 링크 앞 기호. 정적/특수 페이지 강조용.
#   - 깊이(폴더 중첩)는 자유. 상대경로는 build_wiki.py 가 페이지 위치에서 자동 계산.

